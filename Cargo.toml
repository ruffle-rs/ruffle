[workspace]
members = [
    "core",
    "core/build_playerglobal",
    "core/macros",
    "desktop",

    "exporter",
    "exporter/integration_tests",
    "flv",

    "frontend-utils",

    "render",
    "render/canvas",
    "render/naga-agal",
    "render/pixel_bender",
    "render/pixel_bender/assembly_tests",
    "render/webgl",
    "render/wgpu",
    "scanner",
    "swf",

    "tests",
    "tests/framework",
    "tests/fs-tests-runner",
    "tests/input-format",
    "tests/mocket",
    "tests/socket-format",

    "tools/asc",
    "tools/fuzzer",
    "tools/stub-report",

    "video",
    "video/external",
    "video/software",
    "web",
    "web/packages/extension/safari",
    "wstr",
]
default-members = ["desktop"]
resolver = "2"

[workspace.package]
authors = ["Ruffle LLC <ruffle@ruffle.rs>"]
edition = "2024"
homepage = "https://ruffle.rs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ruffle-rs/ruffle"
version = "0.8.0"

[workspace.dependencies]
anyhow = "1.0"
approx = "0.5.1"
async-channel = "2.5.0"
bitflags = "2.12.1"
bitstream-io = "4.10.0"
bytemuck = "1.25.0"
byteorder = "1.5"
chrono = { version = "0.4.44", default-features = false }
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6"
cpal = "0.16.0"
egui = "0.36.1"
egui-wgpu = "0.36.1"
egui-winit = "0.36.1"
egui_extras = { version = "0.36.1", default-features = false }
encoding_rs = "0.8.35"
enum-map = "2.7.3"
flate2 = "1.1.9"
fluent-templates = "0.15.1"
fnv = "1.0.7"
futures = "0.3.32"
gc-arena = { version = "0.7.0", features = ["enum-map", "hashbrown", "indexmap", "slotmap", "smallvec"] }
hashbrown = "0.17.1"
image = { version = "0.25.10", default-features = false }
indexmap = "2.13.0"
indicatif = "0.18"
jpegxr = { git = "https://github.com/ruffle-rs/jpegxr", rev = "86cc1749d493288f53d7290ac3eb7082c475b5d9" }
js-sys = "0.3.97"
libtest-mimic = "0.8.2"
log = "0.4"
lzma-rs = "0.3.0"
memmap2 = "0.9.10"
naga = { version = "30.0.2", features = ["wgsl-out"] }
num-derive = "0.4.2"
num-traits = "0.2.19"
percent-encoding = "2.3.2"
png = "0.18.1"
proc-macro2 = "1.0.106"
quick-xml = "0.41.0"
quote = "1.0.45"
rand = { version = "0.10.1", default-features = false }
rascal = "0.3.5"
rayon = "1.12.0"
regex = "1.12.3"
regress = { git = "https://github.com/ruffle-rs/regras3", rev = "6d48179d6bd448f2cc66b76352c9f048dde968d1" }
reqwest = { version = "0.13.5", default-features = false }
rfd = { version = "0.17.2", default-features = false, features = ["wayland", "xdg-portal"] }
serde = "1.0.228"
serde_json = "1.0.150"
sha2 = "0.10.9"
slotmap = "1.1.1"
smallvec = { version = "1.15.1", features = ["const_new", "union"] }
swfasm = "0.2.0"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = "1.52.3"
toml = "1.0.6"
toml_edit = "0.25.4"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-wasm = "0.2.1"
url = "2.5.9"
vfs = "0.13.0"
walkdir = "2.5.0"
# Make sure to match wasm-bindgen-cli version to this everywhere.
wasm-bindgen = "=0.2.127"
web-sys = "0.3.97"
wgpu = "30.0.2"
wgpu-profiler = "0.28.0"
zip = { version = "9.0.5", default-features = false }

[workspace.lints.rust]
# Clippy nightly often adds new/buggy lints that we want to ignore.
# Don't warn about these new lints on stable.
renamed_and_removed_lints = "allow"
unknown_lints = "allow"

[workspace.lints.clippy]
# Notice: this is an important lint in Ruffle as we have a lot of trivially
# copyable objects (e.g. Gc pointers). It may produce false positives depending
# on platform.
# In case it happens, add `#[allow(clippy::trivially_copy_pass_by_ref)]` and
# add a comment explaining why.
trivially_copy_pass_by_ref = "deny"
redundant_clone = "deny"
unused_async = "deny"
used_underscore_items = "deny"
dbg_macro = "warn"
enum_glob_use = "deny"
branches_sharing_code = "warn"
needless_pass_by_ref_mut = "warn"

# TODO Enable used_underscore_binding when false positives get fixed.

# LONG-TERM: These lints are unhelpful.
manual_map = "allow"             # Less readable: Suggests `opt.map(..)` instead of `if let Some(opt) { .. }`
manual_range_contains = "allow"  # Less readable: Suggests `(a..b).contains(n)` instead of `n >= a && n < b`
assigning_clones = "allow"       # Sometimes useful, but more often than not it doesn't do anything as
                                 # we overwrite an empty item. And sometimes it can even be a footgun
                                 # by keeping big allocations alive.
byte_char_slices = "allow"       # Less expressive: Suggests `b"abc"` byte string literal instead of an explicit
                                 # `[b'a', b'b', b'c']` array. The array form is clearer when the elements
                                 # represent a set of alternatives (any-of) rather than a byte sequence.

[profile.dev]
panic = "unwind"

[profile.dev.package.h263-rs]
opt-level = 3

[profile.dev.package.h263-rs-yuv]
opt-level = 3

[profile.dev.package.nihav_core]
opt-level = 3

[profile.dev.package.nihav_codec_support]
opt-level = 3

[profile.dev.package.nihav_duck]
opt-level = 3

[profile.release]
panic = "abort"

# Don't optimize build scripts and macros.
[profile.release.build-override]
opt-level = 0

[profile.dist]
inherits = "release"
lto = true
codegen-units = 1

# TODO: Set rustflags here instead of in tools/build_wasm.ts, when that
# feature becomes stable. See: https://github.com/rust-lang/cargo/issues/10271
# Until then, these custom profiles let cargo keep the build cache alive
# across "dual-wasm" builds, separating it for the two .wasm modules.
[profile.web-wasm-mvp]
inherits = "release"

[profile.web-wasm-extensions]
inherits = "release"

[profile.ci]
inherits = "release"
debug-assertions = true
overflow-checks = true
# "Not too slow to compile, fast enough to run."
opt-level = 2
# Takes too long, especially on Windows, with marginal benefit otherwise.
lto = "off"
# This is also set with higher authority in `test_rust.yml`.
incremental = true
# Right between the defaults of 16 and 256, for crate fragment caching.
codegen-units = 64
# Tests have to unwind. With `panic = "abort"` (from `release`), the binaries
# built along with the tests and all of their dependencies would get a full
# second build.
panic = "unwind"
