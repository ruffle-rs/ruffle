[package]
name = "ruffle_render"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
byteorder = { workspace = true }
clap = { workspace = true, optional = true }
enum-map = { workspace = true }
flate2 = { workspace = true }
gif = "0.14.2"
guillotiere = "0.7.0"
h263-rs-yuv = { git = "https://github.com/ruffle-rs/h263-rs", rev = "8215bc7a716f0aa7e0a9bbe97af76c97ac0bfb82" }
image = { workspace = true }
indexmap = { workspace = true }
jpegxr = { workspace = true, optional = true }
lyon = { version = "1.0.1", optional = true }
lyon_geom = "1.0.6"
naga-agal = { path = "naga-agal" }
num-derive = { workspace = true }
num-traits = { workspace = true }
pixel_bender = { path = "pixel_bender"}
png = { workspace = true }
ruffle_wstr = { path = "../wstr" }
serde = { workspace = true, features = ["derive"], optional = true }
smallvec = { workspace = true }
swf = { path = "../swf"}
thiserror = { workspace = true }
tracing = { workspace = true }
wasm-bindgen = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }

[dependencies.jpeg-decoder]
version = "0.3.2"
default-features = false # can't use rayon on web

# This crate has a `compile_error!` on apple platforms
[target.'cfg(not(target_vendor = "apple"))'.dependencies.renderdoc]
version = "0.12.1"
optional = true

[dev-dependencies]
approx = { workspace = true }

[features]
default = []
tessellator = ["lyon"]
web = ["wasm-bindgen"]
wgpu = ["dep:wgpu"]
serde = ["dep:serde"]
jpegxr = ["dep:jpegxr", "image/tiff"]
