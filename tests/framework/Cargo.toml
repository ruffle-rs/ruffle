[package]
name = "ruffle_test_framework"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
approx = { workspace = true }
asc = { path = "../../tools/asc" }
async-channel = { workspace = true }
cfg-expr = "0.20.8"
chrono = { workspace = true }
clap = { workspace = true, optional = true }
image = { workspace = true, features = ["png"] }
oxipng = "10.1.1"
percent-encoding = { workspace = true }
pretty_assertions = "1.4.1"
rascal = { workspace = true }
regex = { workspace = true }
ruffle_core = { path = "../../core", features = ["timeline_debug", "avm2_debug", "audio", "mp3", "aac", "default_font", "serde"] }
ruffle_input_format = { path = "../input-format" }
ruffle_render = { path = "../../render", features = ["serde"] }
ruffle_socket_format = { path = "../socket-format" }
ruffle_video_external = { path = "../../video/external", features = ["openh264"], optional = true }
ruffle_video_software = { path = "../../video/software", optional = true }
serde = { workspace = true }
sha2 = { workspace = true }
swfasm = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
url = { workspace = true }
vfs = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
ruffle_frontend_utils = { path = "../../frontend-utils", default-features = false, features = [
    "freetype",
], optional = true }

[features]
jpegxr = ["ruffle_core/jpegxr"]
lzma = ["ruffle_core/lzma"]
freetype = ["dep:ruffle_frontend_utils"]
