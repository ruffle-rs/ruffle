num_ticks = 1

[fonts.a]
family = "TestFontA"
path = "TestFontA.ttf"

[fonts.b]
family = "TestFontB"
path = "TestFontB.ttf"

[default_fonts]
sans = ["TestFontA", "TestFontB"]

[[compilers]]
type = "Rascal"
target = "test.swf"
scripts = ["test.as"]
swf_version = 15
stage_rect = { x_min = 0.0, y_min = 0.0, x_max = 200.0, y_max = 50.0 }
