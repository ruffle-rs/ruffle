<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- To re-create the expected output using Flash Player, set FONTCONFIG_FILE -->
<!-- to the path of this file before running the test. -->
<fontconfig>
  <dir prefix="relative">.</dir>

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>TestFontA</family>
      <family>TestFontB</family>
    </prefer>
  </alias>
</fontconfig>
