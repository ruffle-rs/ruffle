num_ticks = 80 # 4 secs of sound, 1 sec of silence, then 3 secs after seeking.

[player_options]
with_audio = true

[audio_assertions."sound.5"]
frames = [5]
max_amplitude = 0.1

[audio_assertions."sound.15"]
frames = [15]
min_max_amplitude = 0.3
max_amplitude = 0.35

[audio_assertions."sound.25"]
frames = [25]
min_max_amplitude = 0.6
max_amplitude = 0.65

[audio_assertions."sound.35"]
frames = [35]
min_max_amplitude = 0.9
max_amplitude = 0.95

# padding silence
[audio_assertions."sound.45"]
frames = [45]
max_amplitude = 0.1

# after first seek
[audio_assertions."sound.55"]
frames = [55]
min_max_amplitude = 0.3
max_amplitude = 0.35

# after second seek
[audio_assertions."sound.65"]
frames = [65]
min_max_amplitude = 0.9
max_amplitude = 0.95

# padding silence again
[audio_assertions."sound.75"]
frames = [75]
max_amplitude = 0.1
