num_ticks = 30

# Note: rect.jpeg is created by `magick -size 100x100 xc:skyblue rect.jpeg`

[[compilers]]
type = "Swfasm"
source = "test.swfasm" # generated by `./gen_swfasm.rs`
target = "test.swf"

[approximations]
number_patterns = [
    'a=(NaN|[0-9.e+-]*), b=(NaN|[0-9.e+-]*), c=(NaN|[0-9.e+-]*), d=(NaN|[0-9.e+-]*), tx=(NaN|[0-9.e+-]*), ty=(NaN|[0-9.e+-]*)',
    '_[xy]scale: ([0-9.e+-]*)',
    '_rotation: ([0-9.e+-]*)',
]

epsilon = 1e-5
