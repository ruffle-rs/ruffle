# Test adapted from Shumway at https://github.com/mozilla/shumway/tree/master/test/swfs/acid

num_frames = 10

# The fixed point matrix of the rotation setter moves a few texels and edge pixels of the bitmap.
[image_comparisons.output]
tolerance = 11
max_outliers = 40

[player_options]
with_renderer = { optional = false, quality = "low" }
