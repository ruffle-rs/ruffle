[package]
name = "ruffle_frontend_utils"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = ["native-tls"]
cpal = ["dep:cpal", "dep:bytemuck", "ruffle_core/audio"]
fs = []
navigator = ["fs", "dep:async-io", "dep:tokio"]
ui = []
freetype = ["ui", "dep:freetype-rs"]

# TLS backend for reqwest, chosen at compile time (native-tls wins if both are enabled).
# Either way, root certificates come from the platform's trust store.
# - `native-tls` (default): the system TLS library; smaller binary.
# - `rustls-tls`: for platforms without a usable native-tls (e.g. Android).
#     No crypto provider is included: the app must install one (e.g. from `ring`)
#     before building any reqwest client, otherwise reqwest panics.
native-tls = ["reqwest/native-tls"]
rustls-tls = ["reqwest/rustls-no-provider"]

[dependencies]
toml_edit = { workspace = true, features = ["parse"] }
url = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
zip = { workspace = true, features = ["deflate"] }
urlencoding = "2.1.3"
ruffle_core = { path = "../core", default-features = false }
ruffle_render = { path = "../render", default-features = false }
async-channel = { workspace = true }
async-io = { version = "2.6.0", optional = true }
futures-lite = "2.6.1"
# Note: no TLS backend is enabled in this list on purpose; it is provided by
# this crate's `native-tls` (default) / `rustls-tls` features instead.
reqwest = { workspace = true, features = [
    "socks",
    "cookies",
    "charset",
    "http2",
    "system-proxy",
] }
tokio = { workspace = true, features = ["net", "macros"], optional = true }
cpal = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
freetype-rs = { version = "0.38.0", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
macro_rules_attribute = "0.2.2"
