[package]
name = "ruffle_video_software"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
ruffle_render = { path = "../../render" }
ruffle_video = { path = ".." }
swf = { path = "../../swf" }
slotmap = { workspace = true }
thiserror = { workspace = true }
flate2 = { workspace = true }
log = { workspace = true }

h263-rs = { git = "https://github.com/ruffle-rs/h263-rs", rev = "27ee833ca97aadd2a14cf0b3b4ec8b53f31ff6bd", optional = true }
h263-rs-deblock = { git = "https://github.com/ruffle-rs/h263-rs", rev = "27ee833ca97aadd2a14cf0b3b4ec8b53f31ff6bd", optional = true }
nihav_core = { git = "https://github.com/ruffle-rs/nihav-vp6", rev = "12d0bdf10a85641dc2de3d6900c747894431ed77", optional = true }
nihav_codec_support = { git = "https://github.com/ruffle-rs/nihav-vp6", rev = "12d0bdf10a85641dc2de3d6900c747894431ed77", optional = true }
nihav_duck = { git = "https://github.com/ruffle-rs/nihav-vp6", rev = "12d0bdf10a85641dc2de3d6900c747894431ed77", optional = true }

[features]
default = ["h263", "vp6", "screenvideo"]
h263 = ["h263-rs", "h263-rs-deblock"]
vp6 = ["nihav_core", "nihav_codec_support", "nihav_duck"]
screenvideo = []
